services:
  imagesilo:
    image: imagesilo:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IMAGESILO_PORT:-8080}:8080"
    environment:
      IMAGESILO_DATA_DIR: /data
      IMAGESILO_LISTEN_ADDRESS: :8080
      IMAGESILO_PROCESSING_CONCURRENCY: ${IMAGESILO_PROCESSING_CONCURRENCY:-4}
      IMAGESILO_SHUTDOWN_TIMEOUT: 10s
      IMAGESILO_COOKIE_SECURE: ${IMAGESILO_COOKIE_SECURE:-true}
    volumes:
      - imagesilo-data:/data
    stop_grace_period: 20s

volumes:
  imagesilo-data:
