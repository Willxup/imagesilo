name: Release image

on:
  push:
    tags: ['v*']

concurrency:
  group: release-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      repository: ${{ steps.release.outputs.repository }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || test "${#release_tag}" -gt 80; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          release_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "Release commit is not contained in origin/main: $release_commit" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${owner}/imagesilo" >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Verify locked dependencies
        run: |
          go mod verify
          npm --prefix web audit --omit=dev --audit-level=critical
      - name: Run release quality gate
        run: make check e2e

  release-smoke:
    name: Release smoke and publish (${{ matrix.suffix }})
    needs: [preflight, quality]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
            suffix: amd64
            port: 18100
            benchmark_port: 18110
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
            suffix: arm64
            port: 18101
            benchmark_port: 18111
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      IMAGE_REPOSITORY: ${{ needs.preflight.outputs.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Benchmark delivery index
        run: |
          output="delivery-index-benchmark-${{ matrix.suffix }}.jsonl"
          go run ./tests/performance/delivery_index_benchmark | tee "$output"
          jq --exit-status --slurp 'all(.[]; .lookupFailures == 0 and .bytesPerPath < 1024)' "$output" >/dev/null
          {
            echo "### Native ${{ matrix.suffix }} delivery index benchmark"
            echo '```json'
            cat "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve immutable image references
        id: image
        shell: bash
        run: |
          set -euo pipefail
          platform_target="${IMAGE_REPOSITORY}:${RELEASE_TAG}-${{ matrix.suffix }}"
          content_target="${IMAGE_REPOSITORY}:${RELEASE_TAG}-${{ matrix.suffix }}-sha-${RELEASE_COMMIT:0:16}"
          echo "platform_target=$platform_target" >> "$GITHUB_OUTPUT"
          echo "content_target=$content_target" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve fail-closed registry state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          read -r platform_state platform_digest < <(bash scripts/registry-image-state.sh "${{ steps.image.outputs.platform_target }}")
          read -r content_state content_digest < <(bash scripts/registry-image-state.sh "${{ steps.image.outputs.content_target }}")
          case "${platform_state}:${content_state}" in
            absent:absent)
              mode=build
              ;;
            absent:present)
              mode=repair
              ;;
            present:present)
              if test "$platform_digest" != "$content_digest"; then
                echo "Existing platform and content tags disagree" >&2
                exit 1
              fi
              mode=reuse
              ;;
            present:absent)
              echo "Existing platform tag cannot be proven to contain this commit" >&2
              exit 1
              ;;
            *)
              echo "Unexpected registry state" >&2
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "content_digest=${content_digest:-}" >> "$GITHUB_OUTPUT"
      - name: Build native image
        if: steps.state.outputs.mode == 'build'
        run: |
          docker build \
            --platform "${{ matrix.platform }}" \
            --build-arg "VERSION=${RELEASE_TAG}" \
            --build-arg "BUILD_REVISION=${RELEASE_COMMIT}" \
            --build-arg "BUILD_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            --file deploy/docker/Dockerfile \
            --tag "${{ steps.image.outputs.content_target }}" \
            .
      - name: Run native container smoke
        if: steps.state.outputs.mode == 'build'
        env:
          IMAGE: ${{ steps.image.outputs.content_target }}
          PLATFORM: ${{ matrix.platform }}
          PORT: ${{ matrix.port }}
          SMOKE_SUFFIX: release-${{ matrix.suffix }}
        run: bash scripts/container-smoke.sh
      - name: Benchmark native processing at concurrency 1
        if: steps.state.outputs.mode == 'build'
        env:
          IMAGE: ${{ steps.image.outputs.content_target }}
          PLATFORM: ${{ matrix.platform }}
          PORT: ${{ matrix.benchmark_port }}
          BENCH_SUFFIX: release-${{ matrix.suffix }}
          CONCURRENCIES: "1"
          CPU_LIMIT: "1"
          MEMORY_LIMIT: 768m
          PIDS_LIMIT: "256"
          MAX_MEMORY_PEAK_BYTES: "536870912"
          MAX_P95_MILLISECONDS: "20000"
        run: |
          output="processing-benchmark-${{ matrix.suffix }}.jsonl"
          bash scripts/processing-benchmark.sh | tee "$output"
          {
            echo "### Native ${{ matrix.suffix }} processing benchmark (concurrency 1)"
            echo '```json'
            cat "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish new immutable platform content
        if: steps.state.outputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.content_target }}"
          read -r state _ < <(bash scripts/registry-image-state.sh "${{ steps.image.outputs.platform_target }}")
          if test "$state" != absent; then
            echo "Platform tag appeared while publishing; refusing to overwrite it" >&2
            exit 1
          fi
          docker tag "${{ steps.image.outputs.content_target }}" "${{ steps.image.outputs.platform_target }}"
          docker push "${{ steps.image.outputs.platform_target }}"
      - name: Restore platform tag from same-commit content
        if: steps.state.outputs.mode == 'repair'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.platform_target }}" \
            "${IMAGE_REPOSITORY}@${{ steps.state.outputs.content_digest }}"
      - name: Verify immutable platform digest and revision
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          read -r platform_state platform_digest < <(bash scripts/registry-image-state.sh "${{ steps.image.outputs.platform_target }}")
          read -r content_state content_digest < <(bash scripts/registry-image-state.sh "${{ steps.image.outputs.content_target }}")
          if test "$platform_state" != present || test "$content_state" != present || test "$platform_digest" != "$content_digest"; then
            echo "Published platform state is incomplete or inconsistent" >&2
            exit 1
          fi
          docker pull "${IMAGE_REPOSITORY}@${platform_digest}" >/dev/null
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_REPOSITORY}@${platform_digest}")"
          architecture="$(docker image inspect --format '{{ .Architecture }}' "${IMAGE_REPOSITORY}@${platform_digest}")"
          test "$revision" = "$RELEASE_COMMIT"
          test "$architecture" = "${{ matrix.architecture }}"
          echo "digest=$platform_digest" >> "$GITHUB_OUTPUT"

  manifest:
    name: Publish release manifest
    needs: [preflight, release-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.preflight.outputs.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or verify version and latest manifests
        shell: bash
        run: |
          set -euo pipefail
          target="${IMAGE_REPOSITORY}:${RELEASE_TAG}"
          latest="${IMAGE_REPOSITORY}:latest"
          read -r amd64_state amd64_digest < <(bash scripts/registry-image-state.sh "${target}-amd64")
          read -r arm64_state arm64_digest < <(bash scripts/registry-image-state.sh "${target}-arm64")
          if test "$amd64_state" != present || test "$arm64_state" != present; then
            echo "Platform images are missing" >&2
            exit 1
          fi
          expected="$(printf '%s\n%s\n' "$amd64_digest" "$arm64_digest" | sort)"
          verify_manifest() {
            local reference="$1"
            local raw actual count state digest
            raw="$(docker buildx imagetools inspect --raw "$reference")"
            actual="$(jq --raw-output '.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .digest' <<<"$raw" | sort)"
            count="$(jq '.manifests | length' <<<"$raw")"
            if test "$count" != 2 || test "$actual" != "$expected"; then
              echo "Manifest does not match published platform digests: $reference" >&2
              exit 1
            fi
            read -r state digest < <(bash scripts/registry-image-state.sh "$reference")
            test "$state" = present
            printf '%s\n' "$digest"
          }

          read -r target_state _ < <(bash scripts/registry-image-state.sh "$target")
          if test "$target_state" = absent; then
            docker buildx imagetools create \
              --tag "$target" \
              "${IMAGE_REPOSITORY}@${amd64_digest}" \
              "${IMAGE_REPOSITORY}@${arm64_digest}"
          fi
          final_digest="$(verify_manifest "$target")"

          newer_tag=""
          while IFS= read -r candidate_tag; do
            candidate_commit="$(git rev-parse "${candidate_tag}^{commit}")"
            if test "$candidate_commit" != "$RELEASE_COMMIT" && git merge-base --is-ancestor "$RELEASE_COMMIT" "$candidate_commit"; then
              newer_tag="$candidate_tag"
              break
            fi
          done < <(git tag --list 'v*')

          latest_digest=""
          if test -z "$newer_tag"; then
            docker buildx imagetools create \
              --tag "$latest" \
              "${IMAGE_REPOSITORY}@${amd64_digest}" \
              "${IMAGE_REPOSITORY}@${arm64_digest}"
            latest_digest="$(verify_manifest "$latest")"
          else
            echo "A newer release tag exists; leaving latest unchanged: $newer_tag"
          fi

          docker buildx imagetools inspect "$target" | tee manifest-inspect.txt
          {
            echo "### Published ImageSilo image"
            echo "- Version: \`$target@$final_digest\`"
            if test -n "$latest_digest"; then
              echo "- Latest: \`$latest@$latest_digest\`"
            else
              echo "- Latest: unchanged because newer tag \`$newer_tag\` exists"
            fi
            echo '```text'
            cat manifest-inspect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
